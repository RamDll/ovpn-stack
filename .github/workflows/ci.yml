name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Подготовить .env и самоподписанный TLS-сертификат
        run: |
          cp .env.example .env
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout nginx/ssl/privkey.pem -out nginx/ssl/fullchain.pem \
            -subj "/CN=ci.local"

      - name: Проверить синтаксис docker-compose.yaml
        run: docker compose config >/dev/null

      - name: Собрать образы
        run: docker compose build

      - name: Поднять стек и дождаться healthcheck'ов
        run: docker compose up -d --wait --wait-timeout 420

      - name: Smoke-проверки
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a

          # nginx стартует без healthcheck (генерит .htpasswd в entrypoint) — подождём порт 443
          for i in $(seq 20); do
            curl -sk -o /dev/null https://localhost/ && break
            echo "ждём nginx ($i)…"; sleep 3
          done

          # HTTP -> HTTPS редирект
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = 301

          # панель ovpn-admin закрыта Basic Auth и отвечает с валидными кредами
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/)" = 401
          test "$(curl -sk -o /dev/null -w '%{http_code}' \
                  -u "$BASIC_AUTH_USER:$BASIC_AUTH_PASSWORD" https://localhost/)" = 200

          # Grafana доступна через sub-path /grafana/
          for i in $(seq 12); do
            curl -sk -u "$BASIC_AUTH_USER:$BASIC_AUTH_PASSWORD" \
                 https://localhost/grafana/api/health | grep -q '"database": *"ok"' && break
            echo "ждём Grafana ($i)…"; sleep 5
          done
          curl -fsk -u "$BASIC_AUTH_USER:$BASIC_AUTH_PASSWORD" https://localhost/grafana/api/health

          # Prometheus видит все таргеты в состоянии up
          for i in $(seq 12); do
            up=$(docker compose exec -T prometheus \
                   wget -qO- 'http://localhost:9090/api/v1/targets?state=active' \
                 | grep -o '"health":"up"' | wc -l)
            [ "$up" -ge 3 ] && break
            echo "ждём scrape Prometheus ($i)…"; sleep 5
          done
          [ "$up" -ge 3 ]

          # ovpn-admin отдаёт свои метрики
          docker compose exec -T ovpn-admin \
            wget -qO- http://127.0.0.1:8080/metrics | grep -q '^ovpn_'

          echo "OK: стек поднялся и отвечает"

      - name: Логи контейнеров при падении
        if: failure()
        run: docker compose logs --no-color

      - name: Погасить стек
        if: always()
        run: docker compose down -v
