name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Подготовить .env и самоподписанный TLS-сертификат
        run: |
          cp .env.example .env
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout nginx/ssl/privkey.pem -out nginx/ssl/fullchain.pem \
            -subj "/CN=ci.local"

      - name: Проверить синтаксис docker-compose.yaml
        run: docker compose config >/dev/null

      - name: Собрать образы
        run: docker compose build

      - name: Поднять стек и дождаться healthcheck'ов
        run: docker compose up -d --wait --wait-timeout 420

      - name: Smoke-проверки
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a

          # HTTP -> HTTPS редирект
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = 301

          # панель ovpn-admin закрыта Basic Auth и отвечает с валидными кредами
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/)" = 401
          test "$(curl -sk -o /dev/null -w '%{http_code}' \
                  -u "$BASIC_AUTH_USER:$BASIC_AUTH_PASSWORD" https://localhost/)" = 200

          # бэкенд панели отвечает: настройки сервера + список клиентов (пустой массив на свежем PKI)
          docker compose exec -T ovpn-admin \
            wget -qO- http://127.0.0.1:8080/api/server/settings | grep -q '"status":"ok"'
          test "$(docker compose exec -T ovpn-admin \
            wget -qO- http://127.0.0.1:8080/api/users/list)" = '[]'

          echo "OK: стек поднялся и отвечает"

      - name: Логи контейнеров при падении
        if: failure()
        run: docker compose logs --no-color

      - name: Погасить стек
        if: always()
        run: docker compose down -v

  install-script:
    name: install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: |
          docker run --rm -v "$PWD":/mnt -w /mnt koalaman/shellcheck:stable \
            install.sh scripts/backup.sh

      - name: end-to-end в чистом debian:13 (Docker-in-Docker)
        run: |
          set -e
          docker run -d --name box --privileged -v "$PWD":/src:ro debian:13 sleep 1200
          docker exec -e GH_REF box bash -euo pipefail -c '
            apt-get update -q >/dev/null
            apt-get install -y -q curl ca-certificates iproute2 git >/dev/null
            curl -fsSL https://get.docker.com | sh >/dev/null 2>&1
            dockerd --storage-driver=vfs >/var/log/dockerd.log 2>&1 &
            for i in $(seq 40); do docker info >/dev/null 2>&1 && break; sleep 1; done

            cp /src/install.sh /root/install.sh
            bash /root/install.sh --yes --self-signed --no-fail2ban --no-firewall \
              --ip 203.0.113.10 --password ci-Test-1234 --dir /opt/ovpn-stack \
              --branch "${GH_REF}"

            cd /opt/ovpn-stack
            docker compose ps
            set -a; . ./.env; set +a
            A="-sk -u $BASIC_AUTH_USER:$BASIC_AUTH_PASSWORD"
            test "$(curl $A -o /dev/null -w %{http_code} https://localhost/)" = 200
            test "$(curl $A https://localhost/api/users/list)" = "[]"
            test "$(curl -s -o /dev/null -w %{http_code} http://localhost/healthz)" = 200

            # backup → wipe → restore (scripts/backup.sh уже в клоне)
            curl $A -X POST -d username=keeper https://localhost/api/user/create >/dev/null
            bash scripts/backup.sh --out /root/bak >/dev/null
            rm -rf data .env && docker compose down >/dev/null 2>&1
            bash scripts/backup.sh --restore /root/bak/*.tar.gz --yes >/dev/null
            test "$(curl $A https://localhost/api/users/list | grep -o keeper)" = keeper
            echo "OK: install.sh + backup/restore"
          '
        env:
          GH_REF: ${{ github.head_ref || github.ref_name }}

      - name: Логи при падении
        if: failure()
        run: docker exec box cat /var/log/dockerd.log 2>/dev/null || true

      - name: Убрать контейнер
        if: always()
        run: docker rm -f box || true
