version: 2

updates:
  # Go-модули панели ovpn-admin (admin/go.mod)
  - package-ecosystem: "gomod"
    directory: "/admin"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # minor/patch — одним PR; major по-прежнему отдельными
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Фронтенд-панель (admin/frontend/package.json)
  - package-ecosystem: "npm"
    directory: "/admin/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-all:
        patterns: ["*"]
    ignore:
      # TypeScript 7 (нативный порт) ломает vue-tsc@3 — держим ^6 до его поддержки
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Базовые образы Dockerfile'ов (docker-compose.yaml собирает всё локально)
  - package-ecosystem: "docker"
    directories:
      - "/admin"     # Dockerfile.openvpn, Dockerfile.ovpn-admin
      - "/nginx"     # Dockerfile
    schedule:
      interval: "weekly"
    groups:
      docker-all:
        patterns: ["*"]
    ignore:
      # node 22 — LTS, major-скачки в билд-стадии фронтенда не нужны
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Экшены в .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-all:
        patterns: ["*"]
