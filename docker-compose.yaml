name: ovpn-stack

# Единый стек: OpenVPN + ovpn-admin + Prometheus + Grafana + nginx.
# Поднимается одной командой:  docker compose up -d
#
# Секреты берутся из .env (см. .env.example). Наружу торчит только nginx
# (80/443) и UDP-порт OpenVPN (7777). Панель ovpn-admin и Grafana доступны
# исключительно через nginx с TLS + Basic Auth.

services:
  # ---------------------------------------------------------------------------
  # OpenVPN-сервер (hardened: UDP, AES-256-GCM, tls-crypt, TLS1.2+, cert-only)
  # ---------------------------------------------------------------------------
  openvpn:
    build:
      context: ./admin
      dockerfile: Dockerfile.openvpn
    image: ovpn-stack/openvpn:local
    restart: unless-stopped
    command: /etc/openvpn/setup/configure.sh
    environment:
      OVPN_SERVER_NET: "10.0.0.0"
      OVPN_SERVER_MASK: "255.255.255.0"
      OVPN_PASSWD_AUTH: "false"
    cap_add:
      - NET_ADMIN
    sysctls:
      # нужно для redirect-gateway (весь трафик клиента через VPN) + MASQUERADE
      - net.ipv4.ip_forward=1
    ports:
      - "7777:1194/udp"
    volumes:
      - ./data/easyrsa:/etc/openvpn/easyrsa
      - ./data/ccd:/etc/openvpn/ccd
    networks:
      - ovpn-stack
    healthcheck:
      test: ["CMD-SHELL", "pidof openvpn >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # первый запуск генерирует CA + серверный серт + DH-параметры — это долго
      start_period: 180s

  # ---------------------------------------------------------------------------
  # ovpn-admin — веб-панель управления, метрики Prometheus на :8080/metrics.
  # Делит сетевой namespace с openvpn (доступ к mgmt-интерфейсу 127.0.0.1:8989).
  # ---------------------------------------------------------------------------
  ovpn-admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.ovpn-admin
    image: ovpn-stack/ovpn-admin:local
    restart: unless-stopped
    command: /app/ovpn-admin
    depends_on:
      openvpn:
        condition: service_healthy
    environment:
      OVPN_DEBUG: "true"
      OVPN_VERBOSE: "true"
      OVPN_NETWORK: "10.0.0.0/24"
      OVPN_CCD: "true"
      OVPN_CCD_PATH: "/mnt/ccd"
      EASYRSA_PATH: "/mnt/easyrsa"
      OVPN_SERVER: "${VPS_PUBLIC_IP}:7777:udp"
      OVPN_INDEX_PATH: "/mnt/easyrsa/pki/index.txt"
      OVPN_AUTH: "false"
      OVPN_AUTH_DB_PATH: "/mnt/easyrsa/pki/users.db"
      LOG_LEVEL: "debug"
    network_mode: "service:openvpn"
    volumes:
      - ./data/easyrsa:/mnt/easyrsa
      - ./data/ccd:/mnt/ccd
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Prometheus — скрейпит ovpn-admin (openvpn:8080) и node-exporter. Хранение 365д.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=365d"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ovpn-stack

  # ---------------------------------------------------------------------------
  # Grafana — datasource и дашборд ovpn-admin провижнятся автоматически.
  # Отдаётся из-под nginx по пути /grafana/.
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SERVER_ROOT_URL: "https://${VPS_PUBLIC_IP}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - ovpn-stack

  # ---------------------------------------------------------------------------
  # node-exporter — метрики хоста (CPU/RAM/диск/аптайм).
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - ovpn-stack

  # ---------------------------------------------------------------------------
  # nginx — reverse proxy: TLS + Basic Auth, / -> ovpn-admin, /grafana/ -> Grafana.
  # .htpasswd генерируется из BASIC_AUTH_* при старте (см. nginx/Dockerfile).
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: ./nginx
    image: ovpn-stack/nginx:local
    restart: unless-stopped
    depends_on:
      - ovpn-admin
      - grafana
    environment:
      BASIC_AUTH_USER: "${BASIC_AUTH_USER}"
      BASIC_AUTH_PASSWORD: "${BASIC_AUTH_PASSWORD}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/acme:/var/www/letsencrypt
    networks:
      - ovpn-stack

networks:
  ovpn-stack:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
