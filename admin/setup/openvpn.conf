# server 172.16.100.0 255.255.255.0
verb 3
tls-server
tls-version-min 1.2
auth SHA256
ca /etc/openvpn/easyrsa/pki/ca.crt
key /etc/openvpn/easyrsa/pki/private/server.key
cert /etc/openvpn/easyrsa/pki/issued/server.crt
# EC-PKI (prime256v1) + AES-256-GCM + TLS 1.2+: ключ согласуется через ECDHE,
# статические DH-параметры не нужны
dh none
crl-verify /etc/openvpn/easyrsa/pki/crl.pem
tls-crypt /etc/openvpn/easyrsa/pki/ta.key
cipher AES-256-GCM
# Консервативный MTU: многие клиенты сидят за PPPoE (реальный path MTU ~1492)
# или мобильными сетями с урезанным MTU, а PMTUD на таких путях часто просто
# молча роняет пакеты вместо ICMP "fragmentation needed" — клиент получает
# рабочий handshake, но полностью замолкающий data channel. Пушим safe-MTU
# сразу всем клиентам, чтобы не чинить это вручную на стороне каждого клиента.
tun-mtu 1400
mssfix 1360
#management 127.0.0.1 8989
keepalive 10 60
persist-key
persist-tun
topology subnet
#duplicate-cn
#proto tcp
#port 1194
#dev tun0
status /tmp/openvpn-status.log
user nobody
group nogroup
push "topology subnet"
push "dhcp-option DNS 8.8.8.8"
push "dhcp-option DNS 8.8.4.4"
