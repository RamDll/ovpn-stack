# Reverse proxy для панели ovpn-admin.
#   /  -> ovpn-admin (контейнер openvpn, порт 8080)
# Закрыто Basic Auth (.htpasswd генерируется из .env при старте).

server {
    listen 80;
    server_name _;

    # liveness для docker healthcheck (без TLS и Basic Auth)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ACME http-01 challenge (acme.sh --webroot -w ./nginx/acme)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        auth_basic off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # access_log дублируется в stdout контейнера и в файл /var/log/f2b/
    # (bind-mount на хост) — его читает fail2ban, см. каталог fail2ban/.
    # Ошибки этого server-блока (в т.ч. отказы Basic Auth) — в тот же каталог.
    access_log /dev/stdout main;
    access_log /var/log/f2b/access.log main;
    error_log  /var/log/f2b/error.log warn;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 8m;

    auth_basic           "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # DNS-резолвер Docker — чтобы nginx переразрешал имена контейнеров после рестарта
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $upstream_admin http://openvpn:8080;
        proxy_pass $upstream_admin;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
