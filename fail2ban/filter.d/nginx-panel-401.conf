# fail2ban-фильтр: повторные 401 (Basic Auth) в access-логе панели ovpn-stack.
# Логи пишутся форматом nginx `main`:
#   $remote_addr - $remote_user [$time_local] "$request" $status ...
[Definition]
failregex = ^<HOST> -\s+\S+ \[[^\]]+\] "[A-Z]+ [^"]*" 401 \d
ignoreregex =
datepattern = \[%%d/%%b/%%Y:%%H:%%M:%%S %%z\]
