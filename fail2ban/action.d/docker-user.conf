# Бан IP в цепочке DOCKER-USER.
#
# Пакеты к опубликованным портам docker-контейнеров идут через FORWARD
# (первое правило: -A FORWARD -j DOCKER-USER), а НЕ через INPUT. Поэтому
# штатные banaction (ufw, iptables[chain=INPUT]) их не блокируют, а ufw-бан
# ещё и рубит SSH на хосте. Здесь — точечное правило в DOCKER-USER, которое
# не трогает host-сервисы.
#
# iptables на хосте — это iptables-nft; docker создаёт DOCKER-USER тем же
# бэкендом, поэтому -I/-D работают штатно.

[Definition]
actionban   = iptables -I DOCKER-USER -s <ip> -j DROP
actionunban = iptables -D DOCKER-USER -s <ip> -j DROP
actionstart =
actionstop  =
actioncheck =
